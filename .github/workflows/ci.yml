name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        id: setup-java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Build and test
        # CI has no locally installed PyCharm CE, so build.gradle.kts resolves the
        # platform dependency from the downloadable pycharmCommunity() artifact
        # instead (see the CI env var check there). We also point Gradle's toolchain
        # resolution at the JDK setup-java just installed, overriding the
        # macOS-only local path in gradle.properties.
        env:
          CI: "true"
        run: |
          ./gradlew build --stacktrace \
            -Porg.gradle.java.installations.paths=${{ steps.setup-java.outputs.path }}

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: build/test-results/**/*.xml
          if-no-files-found: ignore

      - name: Verify plugin structure
        env:
          CI: "true"
        run: |
          ./gradlew verifyPluginStructure --stacktrace \
            -Porg.gradle.java.installations.paths=${{ steps.setup-java.outputs.path }}
