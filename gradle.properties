pluginGroup = dev.rooster.plugin
pluginVersion = 0.1.0

# PyCharm CE 2025.2.x -> branch build 252
pluginSinceBuild = 252
pluginUntilBuild = 252.*

# We build against the locally installed PyCharm CE rather than downloading a
# ~1GB IDE distribution. See docs/ARCHITECTURE.md ("Build setup").
platformLocalPath = /Applications/PyCharm CE.app

# The IntelliJ Platform ships its own Kotlin stdlib and coroutines; bundling ours
# would conflict at runtime.
kotlin.stdlib.default.dependency = false

# PyCharm's bundled JBR is a real JDK 21 and is exactly the runtime the plugin
# runs on, so use it for the toolchain instead of installing a second JDK.
org.gradle.java.installations.paths = /Applications/PyCharm CE.app/Contents/jbr/Contents/Home

# 8GB machine: keep the daemons small enough to coexist with the local LLM server.
org.gradle.jvmargs = -Xmx1536m -XX:MaxMetaspaceSize=512m
kotlin.daemon.jvmargs = -Xmx1024m
org.gradle.caching = true
org.gradle.parallel = false
